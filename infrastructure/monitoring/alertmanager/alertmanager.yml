global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/CHANGEME"

# Templates
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# Routing tree
route:
  receiver: slack-default
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts go to PagerDuty and Slack
    - match:
        severity: critical
      receiver: pagerduty-critical
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    - match:
        severity: critical
      receiver: slack-critical
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts go to Slack
    - match:
        severity: warning
      receiver: slack-warning
      group_wait: 1m
      repeat_interval: 4h

    # AI-specific alerts
    - match_re:
        alertname: "Agent.*|LLM.*|Cost.*"
      receiver: slack-ai-alerts
      group_wait: 30s
      repeat_interval: 2h

# Receivers
receivers:
  - name: slack-default
    slack_configs:
      - channel: "#adwp-alerts"
        send_resolved: true
        title: >-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Started:* {{ .StartsAt }}
          {{ end }}

  - name: slack-critical
    slack_configs:
      - channel: "#adwp-critical"
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: >-
          CRITICAL [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          *Started:* {{ .StartsAt }}
          {{ end }}

  - name: slack-warning
    slack_configs:
      - channel: "#adwp-alerts"
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
        title: >-
          WARNING [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          {{ end }}

  - name: slack-ai-alerts
    slack_configs:
      - channel: "#adwp-ai-ops"
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
        title: >-
          AI [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Agent:* {{ .Labels.agent_type }}
          *Tenant:* {{ .Labels.tenant_id }}
          {{ end }}

  - name: pagerduty-critical
    pagerduty_configs:
      - service_key: "CHANGEME_PAGERDUTY_SERVICE_KEY"
        severity: critical
        description: >-
          {{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}
        details:
          service: "{{ .CommonLabels.service }}"
          environment: "{{ .CommonLabels.environment }}"
          num_firing: "{{ .Alerts.Firing | len }}"

# Inhibition rules
inhibit_rules:
  # If a critical alert fires, suppress corresponding warnings
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "service"]
