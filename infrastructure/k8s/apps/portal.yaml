apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: adwp
  labels:
    app: portal
    app.kubernetes.io/part-of: adwp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
        - name: portal
          image: ${ECR_REGISTRY}/adwp/portal:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.adwp.io"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: adwp
  labels:
    app: portal
spec:
  type: ClusterIP
  selector:
    app: portal
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
