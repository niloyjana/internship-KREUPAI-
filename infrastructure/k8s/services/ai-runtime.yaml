apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-runtime
  namespace: adwp
  labels:
    app: ai-runtime
    app.kubernetes.io/part-of: adwp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-runtime
  template:
    metadata:
      labels:
        app: ai-runtime
    spec:
      serviceAccountName: default
      # Prefer GPU-capable nodes when available
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        workload-type: ai-runtime
      containers:
        - name: ai-runtime
          image: ${ECR_REGISTRY}/adwp/ai-runtime:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: adwp-config
            - secretRef:
                name: adwp-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
              # Uncomment for GPU workloads:
              # nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ai-runtime
  namespace: adwp
  labels:
    app: ai-runtime
spec:
  type: ClusterIP
  selector:
    app: ai-runtime
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-runtime-hpa
  namespace: adwp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-runtime
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
