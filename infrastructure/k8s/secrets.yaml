apiVersion: v1
kind: Secret
metadata:
  name: adwp-secrets
  namespace: adwp
  labels:
    app.kubernetes.io/part-of: adwp
type: Opaque
# IMPORTANT: Replace placeholder values with base64-encoded secrets before applying.
# Generate with: echo -n "your-secret" | base64
stringData:
  # Database credentials
  DATABASE_PASSWORD: "CHANGEME"

  # JWT keys (RS256 key pair)
  JWT_PRIVATE_KEY: "CHANGEME"
  JWT_PUBLIC_KEY: "CHANGEME"

  # Field-level encryption key (64 hex chars)
  FIELD_ENCRYPTION_KEY: "CHANGEME"

  # LLM provider API keys
  OPENAI_API_KEY: "CHANGEME"
  ANTHROPIC_API_KEY: "CHANGEME"

  # Integration credentials
  SMTP_PASSWORD: "CHANGEME"
  SLACK_WEBHOOK_URL: "CHANGEME"
  STRIPE_SECRET_KEY: "CHANGEME"
  STRIPE_WEBHOOK_SECRET: "CHANGEME"

  # Redis password
  REDIS_PASSWORD: "CHANGEME"

  # Kafka credentials (if SASL is enabled)
  KAFKA_SASL_USERNAME: "CHANGEME"
  KAFKA_SASL_PASSWORD: "CHANGEME"
